notes: "Two documented modes, neither usable as a verified model here. Implicit caching reports cachedContentTokenCount and discounts those tokens, but its lifetime is explicitly not guaranteed, and a guessed TTL is forbidden (§9.3). Explicit context caching has a documented TTL and storage price per hour, but requires a CachedContent API call the engine does not make. So: zero claimed economics, while still recording provider-reported cache reads as evidence."
