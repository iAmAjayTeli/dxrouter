name: Build and Push Docker Image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  # Derived from the repository itself, so the published image cannot drift from the
  # project that built it: for this repository it resolves to
  # ghcr.io/iamajayteli/dxrouter.
  GHCR_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub is deliberately not a target.
      #
      # This job used to log in to Docker Hub and push a second copy of every image to
      # `decolua/9router` — upstream's own repository. A tag push from this fork would
      # therefore have tried to publish DXRouter builds into another project's namespace,
      # using credentials this repository has no legitimate claim to; with the secrets
      # absent it fails the job instead, so the workflow was broken either way. GHCR is
      # enough, and it needs no secret beyond the automatic GITHUB_TOKEN. Adding a Docker
      # Hub target back means creating a DXRouter-owned repository first.

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.GHCR_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.GHCR_IMAGE }}:buildcache,mode=max
          platforms: linux/amd64,linux/arm64
          provenance: false
          sbom: false
