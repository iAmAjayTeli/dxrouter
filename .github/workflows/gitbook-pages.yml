name: Deploy GitBook to 9router.github.io

on:
  push:
    branches: [main, master]
    paths:
      - "gitbook/**"
      - ".github/workflows/gitbook-pages.yml"
  workflow_dispatch:

concurrency:
  group: gitbook-pages
  cancel-in-progress: true

jobs:
  build-deploy:
    # Upstream's docs site, not this repository's. The deploy step pushes into
    # 9router/9router.github.io with a deploy key only upstream holds, so in this
    # fork every run that reached it failed after a full build — and had the key ever
    # been configured, it would have published into another project's namespace (the
    # same reason docker-publish.yml no longer pushes to upstream's Docker Hub repo).
    # Gated rather than deleted so the file stays mergeable with upstream. Publishing
    # DXRouter docs means choosing a DXRouter-owned target first.
    if: github.repository == 'decolua/9router'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gitbook
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install deps
        run: npm install --no-audit --no-fund

      - name: Build static export
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_BASE_PATH: ""

      - name: Add .nojekyll
        run: touch out/.nojekyll

      - name: Deploy to 9router.github.io
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.GH_PAGES_DEPLOY_KEY }}
          external_repository: 9router/9router.github.io
          publish_branch: main
          publish_dir: gitbook/out
          force_orphan: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "deploy: ${{ github.sha }}"
